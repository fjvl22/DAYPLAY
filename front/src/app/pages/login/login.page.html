<ion-header>
  <ion-toolbar>
    <ion-title>LOGIN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="form-container">

    <h1>Inicio de Sesión</h1>

    <form (ngSubmit)="login()">

      <ion-item>
        <ion-label position="stacked">Nombre de Usuario</ion-label>

        <ion-input type="text" [(ngModel)]="nickname" name="nickname" placeholder="Introduce tu nombre de usuario"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        
        <ion-input type="password" [(ngModel)]="password" name="password" placeholder="Introduce tu contraseña"></ion-input>
      </ion-item>

      <ion-item lines="none">

        <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe">Recordarme</ion-checkbox>

      </ion-item>

      <ion-button expand="block" type="submit">Iniciar Sesión</ion-button>

    </form>

  </div>

</ion-content>
