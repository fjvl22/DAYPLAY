<ion-content>

  <div class="story">

    <h1>{{ title }}</h1>

    <img class="chapter-image" [src]="chapterImage" alt="Imagen del capítulo">

  </div>

  <ion-button class="navigation-button previous-button" fill="clear" (click)="previous()">

    <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>

  </ion-button>

  <ion-button class="navigation-button next-button" fill="clear" (click)="next()">

    <ion-icon slot="icon-only" name="arrow-forward-outline"></ion-icon>

  </ion-button>

</ion-content>
